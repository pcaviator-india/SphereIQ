<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Sphere Core Glow -->
    <radialGradient id="sphereCore" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#1e1b4b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.9" />
    </radialGradient>

    <!-- Wireframe Stroke Gradient -->
    <linearGradient id="wireframeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Outer Orbital Accent Ring -->
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Tech Background Layer -->
  <rect width="500" height="500" fill="url(#bgGlow)" rx="32" />

  <!-- LOGO ICON GROUP (Centered at X:250, Y:195) -->
  <g transform="translate(0, 5)">
    <!-- Base Sphere Backing Shadow/Glow -->
    <circle cx="250" cy="190" r="110" fill="url(#sphereCore)" />

    <!-- Orbital Ring Outer Accent -->
    <ellipse cx="250" cy="190" rx="140" ry="48" fill="none" stroke="url(#orbitGrad)" stroke-width="2.5" transform="rotate(-28, 250, 190)" stroke-dasharray="120 40 80 30" />

    <!-- 3D Wireframe Grid Latitudes (Horizontal Ellipses) -->
    <g fill="none" stroke="url(#wireframeGrad)" stroke-dasharray="none">
      <circle cx="250" cy="190" r="110" stroke-width="2.5" stroke-opacity="0.85" />
      <ellipse cx="250" cy="190" rx="110" ry="78" stroke-width="1.8" stroke-opacity="0.75" />
      <ellipse cx="250" cy="190" rx="110" ry="42" stroke-width="1.8" stroke-opacity="0.7" />
      <ellipse cx="250" cy="190" rx="110" ry="14" stroke-width="1.5" stroke-opacity="0.5" />

      <!-- Longitudes (Vertical Ellipses & Axis) -->
      <line x1="250" y1="80" x2="250" y2="300" stroke-width="1.5" stroke-opacity="0.4" />
      <ellipse cx="250" cy="190" rx="78" ry="110" stroke-width="1.8" stroke-opacity="0.75" />
      <ellipse cx="250" cy="190" rx="42" ry="110" stroke-width="1.8" stroke-opacity="0.7" />
      <ellipse cx="250" cy="190" rx="14" ry="110" stroke-width="1.5" stroke-opacity="0.5" />
    </g>

    <!-- Data Nodes (Glowing Intersection Points) -->
    <g fill="#38bdf8" filter="url(#glow)">
      <!-- Central Highlight Nodes -->
      <circle cx="250" cy="148" r="4.5" />
      <circle cx="208" cy="190" r="4" />
      <circle cx="292" cy="190" r="4" />
      <circle cx="250" cy="232" r="4.5" fill="#818cf8" />
      
      <!-- Offset Diagonal Nodes -->
      <circle cx="295" cy="125" r="3.5" fill="#a855f7" />
      <circle cx="205" cy="255" r="3.5" fill="#06b6d4" />
      <circle cx="172" cy="155" r="3" />
      <circle cx="328" cy="225" r="3" fill="#818cf8" />
      <circle cx="355" cy="165" r="2.5" fill="#38bdf8" />
    </g>
  </g>

  <!-- BRAND TYPOGRAPHY -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- Main Title -->
    <text x="250" y="380" font-size="42" font-weight="300" letter-spacing="2" fill="#f8fafc">
      Sphere<tspan font-weight="800" fill="url(#wireframeGrad)">IQ</tspan>
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="250" y="412" font-size="13" font-weight="500" letter-spacing="6" fill="#64748b">
      3D INTELLIGENCE PLATFORM
    </text>
  </g>
</svg>
